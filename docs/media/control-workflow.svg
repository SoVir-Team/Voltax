<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="818" viewBox="0 0 1440 818" role="img" aria-labelledby="title desc">
<title id="title">VOLTEX local command workflow</title><desc id="desc">Six steps: tap, authorization and deadline check, MQTT delivery, device report, persistence and live event, interface update. Physical load measurement is not implemented.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1b32"/><stop offset="1" stop-color="#183d5b"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0b8cc8"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#169ed8"/></marker><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern></defs>
<rect x="0" y="0" width="1440" height="818" rx="28" fill="#f5f8fc" stroke="none" />
<text x="56" y="75" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="43" fill="#12243b" font-weight="750" >From a tap to a reported result.</text><text x="58" y="115" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" fill="#596c84" font-weight="400" >The app waits for the device report rather than immediately pretending the switch changed.</text><rect x="60" y="164" width="350" height="210" rx="24" fill="#fff" stroke="#d7e4ef" /><rect x="80" y="184" width="47" height="37" rx="12" fill="#e0f4ff" stroke="none" /><text x="92" y="209" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#087cae" font-weight="700" >01</text><text x="82" y="267" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" fill="#12243b" font-weight="700" >You tap Turn on</text><text x="82" y="307" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >The app sends a desired value.</text><text x="82" y="339" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#596c84" font-weight="400" >ON is an absolute command.</text><rect x="545" y="164" width="350" height="210" rx="24" fill="#fff" stroke="#d7e4ef" /><rect x="565" y="184" width="47" height="37" rx="12" fill="#e0f4ff" stroke="none" /><text x="577" y="209" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#087cae" font-weight="700" >02</text><text x="567" y="267" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" fill="#12243b" font-weight="700" >The hub checks</text><text x="567" y="307" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Permission, command ID and age.</text><text x="567" y="339" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#596c84" font-weight="400" >Then it queues the request.</text><rect x="1030" y="164" width="350" height="210" rx="24" fill="#fff" stroke="#d7e4ef" /><rect x="1050" y="184" width="47" height="37" rx="12" fill="#e0f4ff" stroke="none" /><text x="1062" y="209" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#087cae" font-weight="700" >03</text><text x="1052" y="267" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" fill="#12243b" font-weight="700" >MQTT carries it</text><text x="1052" y="307" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >The local broker sends ON.</text><text x="1052" y="339" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#596c84" font-weight="400" >The ESP32 receives the command.</text><rect x="1030" y="435" width="350" height="210" rx="24" fill="#fff" stroke="#d7e4ef" /><rect x="1050" y="455" width="47" height="37" rx="12" fill="#e0f4ff" stroke="none" /><text x="1062" y="480" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#087cae" font-weight="700" >04</text><text x="1052" y="538" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" fill="#12243b" font-weight="700" >The device reports</text><text x="1052" y="578" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Firmware changes the output.</text><text x="1052" y="610" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#596c84" font-weight="400" >It reports its logical state.</text><rect x="545" y="435" width="350" height="210" rx="24" fill="#fff" stroke="#d7e4ef" /><rect x="565" y="455" width="47" height="37" rx="12" fill="#e0f4ff" stroke="none" /><text x="577" y="480" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#087cae" font-weight="700" >05</text><text x="567" y="538" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" fill="#12243b" font-weight="700" >The hub records</text><text x="567" y="578" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >SQLite stores the report.</text><text x="567" y="610" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#596c84" font-weight="400" >A live event goes to the app.</text><rect x="60" y="435" width="350" height="210" rx="24" fill="#fff" stroke="#d7e4ef" /><rect x="80" y="455" width="47" height="37" rx="12" fill="#e0f4ff" stroke="none" /><text x="92" y="480" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#087cae" font-weight="700" >06</text><text x="82" y="538" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" fill="#12243b" font-weight="700" >The app updates</text><text x="82" y="578" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >The switch reflects that report.</text><text x="82" y="610" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#596c84" font-weight="400" >Failure is shown if it cannot settle.</text><path d="M421 267 L533 267" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><path d="M906 267 L1018 267" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><path d="M1205 385 L1205 423" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><path d="M1019 539 L908 539" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><path d="M534 539 L422 539" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="692" width="1320" height="90" rx="18" fill="#eaf7fe" stroke="none" /><text x="83" y="729" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" fill="#12243b" font-weight="650" >A report confirms firmware state, not an electrical measurement of the load.</text><text x="83" y="760" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#596c84" font-weight="400" >The command engine also has an already-reported-state fallback; transport and power-loss guarantees need real-device validation.</text>
</svg>
