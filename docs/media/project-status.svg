<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">VOLTEX project readiness</title><desc id="desc">Working software and passing PC tests are separate from integration foundations and pending hardware, production, mobile trust and load acceptance.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1b32"/><stop offset="1" stop-color="#183d5b"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0b8cc8"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#169ed8"/></marker><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern></defs>
<rect x="0" y="0" width="1440" height="650" rx="28" fill="#f5f8fc" stroke="none" />
<text x="56" y="75" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" fill="#12243b" font-weight="750" >Where the project stands.</text><text x="58" y="115" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" fill="#596c84" font-weight="400" >Evidence-based progress. No invented completion percentage.</text><rect x="60" y="171" width="400" height="385" rx="24" fill="#fff" stroke="#d8e3ec" /><rect x="80" y="193" width="360" height="37" rx="12" fill="#e5f7ef" stroke="none" /><text x="94" y="217" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#078963" font-weight="750" >BUILT + CHECKED ON PC</text><text x="84" y="278" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="27" fill="#12243b" font-weight="750" >Working software</text><circle cx="89" cy="322" r="4" fill="#078963"/><text x="105" y="329" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Customer and staff web apps</text><circle cx="89" cy="368" r="4" fill="#078963"/><text x="105" y="375" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Hub and cloud services</text><circle cx="89" cy="414" r="4" fill="#078963"/><text x="105" y="421" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Permissions, support and fleet</text><circle cx="89" cy="460" r="4" fill="#078963"/><text x="105" y="467" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >444 tests pass in this snapshot</text><rect x="520" y="171" width="400" height="385" rx="24" fill="#fff" stroke="#d8e3ec" /><rect x="540" y="193" width="360" height="37" rx="12" fill="#fff4dc" stroke="none" /><text x="554" y="217" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#ae750e" font-weight="750" >SOURCE + LOCAL INTEGRATION</text><text x="544" y="278" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="27" fill="#12243b" font-weight="750" >Integration foundation</text><circle cx="549" cy="322" r="4" fill="#ae750e"/><text x="565" y="329" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Pi deployment and signed updates</text><circle cx="549" cy="368" r="4" fill="#ae750e"/><text x="565" y="375" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >ESP32 firmware configuration</text><circle cx="549" cy="414" r="4" fill="#ae750e"/><text x="565" y="421" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Broker / SMTP / S3 test harnesses</text><circle cx="549" cy="460" r="4" fill="#ae750e"/><text x="565" y="467" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Production accounts not verified</text><rect x="980" y="171" width="400" height="385" rx="24" fill="#fff" stroke="#d8e3ec" /><rect x="1000" y="193" width="360" height="37" rx="12" fill="#fbefe6" stroke="none" /><text x="1014" y="217" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#986144" font-weight="750" >PENDING ACCEPTANCE</text><text x="1004" y="278" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="27" fill="#12243b" font-weight="750" >Real-world readiness</text><circle cx="1009" cy="322" r="4" fill="#986144"/><text x="1025" y="329" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Raspberry Pi + relay bench tests</text><circle cx="1009" cy="368" r="4" fill="#986144"/><text x="1025" y="375" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >WAN loss and power-cut tests</text><circle cx="1009" cy="414" r="4" fill="#986144"/><text x="1025" y="421" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Production cloud + mobile trust</text><circle cx="1009" cy="460" r="4" fill="#986144"/><text x="1025" y="467" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Security review and sustained load</text><text x="61" y="606" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#12243b" font-weight="650" >CURRENT LEVEL: software prototype with cloud and interface implementation; hardware and production acceptance remain open.</text>
