<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc">
<title id="title">VOLTEX architecture: local control and optional cloud</title><desc id="desc">Customer app communicates with the Pi hub and ESP32 locally. An optional outbound link connects the hub with cloud services and a separate staff portal. Physical button control stays on the ESP32.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1b32"/><stop offset="1" stop-color="#183d5b"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0b8cc8"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#169ed8"/></marker><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern></defs>
<rect x="0" y="0" width="1440" height="1030" rx="28" fill="#f5f8fc" stroke="none" />
<text x="56" y="73" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" fill="#12243b" font-weight="750" >One home. Two paths. Clear boundaries.</text><text x="58" y="113" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" fill="#596c84" font-weight="400" >Daily control stays inside the home. The optional cloud adds company support and fleet operations.</text><rect x="40" y="150" width="1360" height="466" rx="28" fill="#eaf7fe" stroke="#b9ddf2" /><text x="64" y="187" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" fill="#14779f" font-weight="700" letter-spacing="1.5">AT HOME  •  LOCAL CONTROL PATH</text><rect x="64" y="222" width="330" height="186" rx="20" fill="#fff" stroke="#d6e4ef" /><text x="88" y="254" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#147ea7" font-weight="700" letter-spacing="1">01  CUSTOMER INTERFACE</text><text x="88" y="290" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#12243b" font-weight="700" >Home app / PWA</text><text x="88" y="327" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Phones, tablets and browsers</text><text x="88" y="355" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Control, rules, access and updates</text><rect x="526" y="222" width="374" height="186" rx="20" fill="#fff" stroke="#d6e4ef" /><text x="550" y="254" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#147ea7" font-weight="700" letter-spacing="1">02  HOME SERVER</text><text x="550" y="290" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#12243b" font-weight="700" >Raspberry Pi hub</text><text x="550" y="327" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >API + live events + SQLite</text><text x="550" y="355" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Schedules, automations + audit</text><rect x="1034" y="222" width="342" height="186" rx="20" fill="#fff" stroke="#d6e4ef" /><text x="1058" y="254" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#147ea7" font-weight="700" letter-spacing="1">03  DEVICE</text><text x="1058" y="290" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#12243b" font-weight="700" >ESP32 + ESPHome</text><text x="1058" y="327" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Wi-Fi / local MQTT broker</text><text x="1058" y="355" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Relay output + state reporting</text><path d="M398 278 L519 278" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><text x="417" y="259" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" fill="#147ea7" font-weight="650" >REST</text><path d="M520 350 L400 350" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><text x="411" y="380" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#596c84" font-weight="400" >Live events</text><path d="M905 278 L1025 278" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><text x="927" y="258" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" fill="#147ea7" font-weight="650" >MQTT</text><path d="M1028 350 L907 350" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><text x="919" y="381" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#596c84" font-weight="400" >Reports</text><rect x="526" y="444" width="374" height="130" rx="20" fill="#fff" stroke="#d6e4ef" /><text x="550" y="476" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#147ea7" font-weight="700" letter-spacing="1">RUNS ON THE PI</text><text x="550" y="512" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#12243b" font-weight="700" >Mosquitto broker</text><text x="550" y="549" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Per-device credentials + topic ACLs</text><rect x="1034" y="444" width="342" height="130" rx="20" fill="#fff" stroke="#d6e4ef" /><text x="1058" y="476" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#147ea7" font-weight="700" letter-spacing="1">DIRECT GPIO PATH</text><text x="1058" y="512" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#12243b" font-weight="700" >Physical wall button</text><text x="1058" y="549" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Button → ESP32 → relay</text><path d="M1206 440 L1206 414" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="472" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" fill="#12243b" font-weight="700" >If the internet stops:</text><text x="65" y="508" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" fill="#596c84" font-weight="400" >the local path can keep running.</text><text x="65" y="546" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" fill="#596c84" font-weight="400" >Requires a powered, connected home network.</text><text x="65" y="576" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" fill="#596c84" font-weight="400" >Physical behavior still needs hardware tests.</text><path d="M715 619 L715 688" fill="none" stroke="#169ed8" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="738" y="659" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Outbound cloud link • signed requests</text><rect x="40" y="694" width="1360" height="260" rx="28" fill="#f1f1fb" stroke="#dad9ef" /><text x="64" y="732" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" fill="#625b98" font-weight="700" letter-spacing="1">OPTIONAL CLOUD  •  SEPARATE FROM EVERYDAY LOCAL CONTROL</text><rect x="64" y="765" width="410" height="154" rx="20" fill="#fff" stroke="#d6e4ef" /><text x="88" y="797" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#147ea7" font-weight="700" letter-spacing="1">COMPANY INTERFACE</text><text x="88" y="833" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#12243b" font-weight="700" >Staff portal / PWA</text><text x="88" y="870" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Homes, support, staff, audit, fleet</text><rect x="530" y="765" width="430" height="154" rx="20" fill="#fff" stroke="#d6e4ef" /><text x="554" y="797" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#147ea7" font-weight="700" letter-spacing="1">PLATFORM SERVICES</text><text x="554" y="833" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#12243b" font-weight="700" >Cloud API + PostgreSQL</text><text x="554" y="870" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >Assignments, grants and signed rollouts</text><rect x="1016" y="765" width="360" height="154" rx="20" fill="#fff" stroke="#d6e4ef" /><text x="1040" y="797" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#147ea7" font-weight="700" letter-spacing="1">PRIVACY BOUNDARY</text><text x="1040" y="833" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#12243b" font-weight="700" >Owner consent</text><text x="1040" y="870" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#596c84" font-weight="400" >No automatic household control</text><path d="M480 842 L521 842" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><path d="M968 842 L1007 842" fill="none" stroke="#169ed8" stroke-width="3" marker-end="url(#arrow)"/><text x="58" y="997" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" fill="#596c84" font-weight="400" >Source architecture illustration • interfaces are implemented; real Pi deployment and public cloud operation remain unverified.</text>
</svg>
