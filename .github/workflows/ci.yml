name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build web app (static export served by the hub)
        run: npm run build -w frontend/web
      - name: Build admin portal (static export served by the cloud)
        run: npm run build -w frontend/admin

  shell:
    name: Shell script syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          status=0
          for f in $(git ls-files '*.sh'); do bash -n "$f" || status=1; done
          exit $status
