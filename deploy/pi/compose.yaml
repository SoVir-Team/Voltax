# VOLTAX hub services on the Raspberry Pi. Template: voltax-update renders the
# __PLACEHOLDERS__ with image digests from a signed release.json into
# /opt/voltax/releases/<version>/compose.yaml. Data lives outside containers
# (/var/lib/voltax, /etc/voltax), so updates and container recreation keep it.
name: voltax

x-hardening: &hardening
  network_mode: host          # ufw rules apply; mDNS works; no Docker NAT bypass
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  mosquitto:
    <<: *hardening
    image: __MOSQUITTO_IMAGE__
    user: "1883:1883"           # never root; port 1883 is unprivileged
    env_file: /etc/voltax/mosquitto-health.env
    volumes:
      - /etc/voltax/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /etc/voltax/mosquitto/passwd:/mosquitto/config/passwd:ro
      - /etc/voltax/mosquitto/acl:/mosquitto/config/acl:ro
      - /var/lib/voltax/mosquitto:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u healthcheck -P \"$$MQTT_HEALTH_PASS\" -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  voltax-hub:
    <<: *hardening
    image: __HUB_IMAGE__
    user: "10001:10001"         # listens on 8443, so no NET_BIND_SERVICE/root needed
    tmpfs: [/tmp]
    env_file: /etc/voltax/hub.env
    depends_on:
      mosquitto: { condition: service_healthy }
    volumes:
      - /var/lib/voltax/hub:/var/lib/voltax/hub
      - /var/lib/voltax/backups:/var/lib/voltax/backups
      - /etc/voltax/tls:/etc/voltax/tls:ro
      - /run/systemd/timesync:/run/systemd/timesync:ro
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
