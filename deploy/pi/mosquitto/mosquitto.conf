# Local broker for one home. Reachable from the LAN only (ufw), never from the internet.
# MILESTONE 1 LIMITATION: plaintext on 1883. Before production: TLS listener on 8883
# with a Voltax Hub CA certificate, ESPHome certificate_authority, and 1883 closed.

per_listener_settings false
listener 1883 0.0.0.0

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60
# Sessions of clients that vanish are dropped; nothing stale is kept around.
persistent_client_expiration 1h
max_queued_messages 100
queue_qos0_messages false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp false
