<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <title>VOLTEX Home</title>
  <meta name="description" content="Control your VOLTEX smart home, even when the internet is down.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VOLTEX">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar" hidden>
      <img class="topbar-logo" src="assets/brand/logo-wordmark.svg" alt="VOLTEX">
      <span class="conn" id="conn" role="status" aria-live="polite"><i></i><span>Connecting</span></span>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" hidden aria-label="Main">
      <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#/schedules" data-tab="schedules"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Schedules</span></a>
      <a href="#/automations" data-tab="automations"><svg viewBox="0 0 24 24"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></svg><span>Automations</span></a>
      <a href="#/access" data-tab="access"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 5.2a3.4 3.4 0 0 1 0 6.6M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg><span>Access</span></a>
      <a href="#/hub" data-tab="hub"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="11" rx="2.5"/><path d="M8 20h8M12 16v4"/></svg><span>Hub</span></a>
    </nav>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="assertive" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
